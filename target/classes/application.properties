# Server Configuration
server.port=5000

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/task_manager_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (Note: HMAC-SHA keys must be at least 256 bits (32 bytes) long)
jwt.secret=abc123secureabc123secureabc123secureabc123secureabc123secureabc123secure
jwt.refreshSecret=xyz456securexyz456securexyz456securexyz456securexyz456securexyz456secure
jwt.accessTokenExpirationMs=900000
jwt.refreshTokenExpirationMs=604800000

# CORS Configurations
app.frontend.url=http://localhost:3000
