# Server Configuration
server.port=5000

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations (Note: HMAC-SHA keys must be at least 256 bits (32 bytes) long)
jwt.secret=${JWT_SECRET}
jwt.refreshSecret=${JWT_REFRESH_SECRET}
jwt.accessTokenExpirationMs=${JWT_ACCESS_EXP_MS:900000}
jwt.refreshTokenExpirationMs=${JWT_REFRESH_EXP_MS:604800000}

# CORS Configurations
app.frontend.url=http://localhost:3000
